[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf2geo"
version = "0.1.4"
description = "Convert CAD DXF data into geospatial formats and visualisations using GeoPandas/Pyogrio."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Keiran Suchak" }]
keywords = ["DXF", "geospatial", "GIS", "vector", "conversion"]

classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "geopandas>=1.0",
  "pyogrio>=0.11",
  "shapely>=2.0",
  "pandas>=2.0",
  "plotly>=5",
  "tqdm>=4.66",
  "ezdxf>=1.4.3",
]

[project.optional-dependencies]
gdal = ["gdal>=3.12.1"]

dev = [
  "pytest",
  "pytest-mock",
  "ruff",
  "black",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/ksuchak1990/dxf2geo"
Repository = "https://github.com/ksuchak1990/dxf2geo"
Issues = "https://github.com/ksuchak1990/dxf2geo/issues"
DOI = "https://doi.org/10.5281/zenodo.17174880"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dxf2geo"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]
