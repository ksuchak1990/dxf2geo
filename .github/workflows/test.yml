name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv python install 3.12

      - name: Install GDAL system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - run: uv sync --dev
      - run: uv run pytest -q
